[project]
name = "msg-examples"
version = "0.1.0"
description = "Repository-level tooling for the MSG examples collection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mystmd",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "plotly",
]
notebook = [
    "ipywidgets",
    "jupyter-server-proxy",
    "jupyterlab",
    "notebook",
]

[dependency-groups]
dev = [
    "ruff",
]
