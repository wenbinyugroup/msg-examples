[project]
name = "multi-builder-anisotropy"
version = "0.1.0"
description = "Microstructures from four modeling tools, homogenized with SwiftComp via sgio, compared by an energy-ratio anisotropy measure"
readme = "multi_builder_anisotropy.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
plotting = [
    "plotly",
]
notebook = [
    "ipywidgets",
    "jupyter-server-proxy",
    "jupyterlab",
    "notebook",
]
